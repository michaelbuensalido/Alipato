<!doctype html>
<!--
  Alipato hero / 3 — Chiaroscuro Still
  Display + UI face: Hanken Grotesk (200/300 display, 400/500 UI). A plain, slightly
  humanist grotesk that stays even and quiet at extra-light weights, so a very large
  sentence-case headline reads like a film title card rather than a UI heading.
  Canvas is neutralised to a warm black so the single raking beam reads as daylight.
  Tokens map to tailwind.config.ts: canvas, surface, line, fg, muted, accent.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alipato Chiaroscuro Still</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0807;      /* warm black room */
    --surface: #15110E;
    --line: #2B231D;
    --fg: #F4ECE4;
    --muted: #ADA195;
    --accent: #FF5E1A;
    --beam: #F6DEC2;        /* the window light */
    --s: 0.5;
    --beam-angle: 122deg;   /* shared by wall stripes and sphere stripes */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--fg); overflow-x: hidden; }
  body { font-family: "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: #140A04; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .viewport { position: relative; width: 100%; height: calc(900px * var(--s)); overflow: hidden; }
  .stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform: scale(var(--s)); transform-origin: 0 0; overflow: hidden; isolation: isolate;
    background: radial-gradient(ellipse 80% 70% at 62% 30%, #1A1410 0%, #0D0A08 55%, #070605 100%); }

  /* the window beam: blind slats projected on the back wall, soft-edged, falling off away from the window */
  .beam { position: absolute; inset: -80px; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(var(--beam-angle), rgba(246,222,194,0) 0 26px, rgba(246,222,194,.16) 34px 50px, rgba(246,222,194,0) 58px 74px);
    -webkit-mask-image: radial-gradient(ellipse 48% 58% at 66% 30%, #000 0%, rgba(0,0,0,.55) 45%, transparent 78%);
            mask-image: radial-gradient(ellipse 48% 58% at 66% 30%, #000 0%, rgba(0,0,0,.55) 45%, transparent 78%);
    filter: blur(3px); }
  .table { position: absolute; left: 0; right: 0; top: 708px; bottom: 0; z-index: 0;
    background: linear-gradient(to bottom, #15100C 0%, #0B0807 40%, #070605 100%); }
  .table::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(246,222,194,.16) 45%, rgba(246,222,194,.05) 80%, transparent); }
  #still { position: absolute; inset: 0; z-index: 1; width: 1440px; height: 900px; pointer-events: none; }
  .shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(5,4,3,.92) 0%, rgba(5,4,3,.55) 26%, rgba(5,4,3,0) 50%),
      linear-gradient(0deg, rgba(5,4,3,.85) 0%, rgba(5,4,3,0) 34%),
      radial-gradient(ellipse 120% 90% at 60% 40%, transparent 55%, rgba(0,0,0,.6) 100%); }
  .grain { position: absolute; inset: -50%; z-index: 8; pointer-events: none; opacity: .2; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(6) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }

  /* glass nav bar */
  .nav { position: absolute; z-index: 10; left: 40px; right: 40px; top: 26px; height: 66px; padding: 0 10px 0 22px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(22,17,14,.42); border: 1px solid rgba(246,222,194,.09); border-radius: 18px;
    -webkit-backdrop-filter: blur(16px) saturate(120%); backdrop-filter: blur(16px) saturate(120%); }
  .logo img { height: 44px; width: auto; display: block; }
  .links { display: flex; gap: 32px; margin-left: 56px; margin-right: auto; }
  .links a { font-size: 14px; color: rgba(244,236,228,.74); transition: color .3s ease; }
  .links a:hover { color: var(--fg); }

  .btn { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 20px; border-radius: 999px; font-size: 15px; font-weight: 500;
    background: var(--accent); color: #140A04; transition: background-color .3s ease; }
  .btn .ic { width: 30px; height: 30px; border-radius: 999px; background: rgba(20,10,4,.14); display: grid; place-items: center; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .btn svg { width: 16px; height: 16px; }
  .btn:hover { background: #FF7134; }
  .btn:hover .ic { transform: rotate(45deg); }
  .nav .btn { height: 44px; font-size: 14px; padding-left: 18px; }

  /* headline, lower left */
  .title { position: absolute; z-index: 5; left: 80px; top: 470px; }
  h1 { margin: 0; font-weight: 200; font-size: 104px; line-height: .98; letter-spacing: -0.04em; color: var(--fg); }
  h1 em { font-style: normal; color: #FFB48A; font-weight: 200; }
  .more { margin-top: 34px; display: inline-flex; align-items: center; gap: 12px; font-size: 15px; color: rgba(244,236,228,.82); }
  .more .ring { width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(246,222,194,.3); display: grid; place-items: center; transition: border-color .3s ease, transform .4s cubic-bezier(.2,.8,.2,1); }
  .more svg { width: 15px; height: 15px; }
  .more:hover { color: var(--fg); }
  .more:hover .ring { border-color: var(--accent); transform: translateY(3px); }

  /* the floating audit card, lower right */
  .card { position: absolute; z-index: 6; left: 1050px; top: 566px; width: 330px; padding: 24px 24px 22px; border-radius: 20px;
    background: rgba(24,19,15,.72); border: 1px solid rgba(246,222,194,.1);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), 0 8px 18px -8px rgba(0,0,0,.6); }
  .card .label { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 500; color: #FFB48A; background: rgba(255,94,26,.1); border: 1px solid rgba(255,94,26,.22); }
  .card .label i { width: 5px; height: 5px; border-radius: 99px; background: var(--accent); }
  .card p { margin: 16px 0 22px; font-size: 16px; line-height: 1.55; color: var(--muted); }
  .card .btn { width: 100%; justify-content: space-between; }

  @media (prefers-reduced-motion: reduce) {
    .grain { animation: none; }
    .btn .ic, .more .ring { transition: none; }
  }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage">
    <div class="beam" aria-hidden="true"></div>
    <div class="table" aria-hidden="true"></div>
    <canvas id="still" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <nav class="nav" aria-label="Primary">
      <a class="logo" href="#"><img src="../assets/logo.svg" alt="Alipato"></a>
      <div class="links">
        <a href="#services">Services</a>
        <a href="#process">Process</a>
        <a href="#pricing">Pricing</a>
        <a href="#work">Work</a>
        <a href="#agency">About</a>
        <a href="#contact">Contact</a>
      </div>
      <a class="btn" href="#contact">Book a Free Audit
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
    </nav>

    <div class="title">
      <h1>Digital growth,<br>engineered<br><em>for scale</em></h1>
      <a class="more" href="#services"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>Explore our services</a>
    </div>

    <aside class="card" aria-label="Free audit">
      <span class="label"><i></i>Free Audit</span>
      <p>A digital growth and IT solutions partner building automated client acquisition and operations pipelines for SMEs.</p>
      <a class="btn" href="#contact">Book a Free Audit
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
    </aside>

    <div class="grain" aria-hidden="true"></div>
  </div>
</div>

<script>
(() => {
  const W = 1440, H = 900;
  const CX = 900, CY = 404, R = 292;          // the object, resting just above the table line
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  const cv = document.getElementById('still');
  let ratio = 1;

  function fit() {
    const s = root.clientWidth / 1440;
    root.style.setProperty('--s', s);
    ratio = Math.min(2, Math.max(1, s * (window.devicePixelRatio || 1)));
    cv.width = Math.round(W * ratio); cv.height = Math.round(H * ratio);
    if (reduce) draw(3.4);
  }

  /* geometry: shell of parallels and meridians, an icosahedral cage, an ember at the heart */
  const PHI = (1 + Math.sqrt(5)) / 2, segs = [];
  const addPoly = (pts, kind) => { for (let i = 0; i < pts.length - 1; i++) segs.push({ a: pts[i], b: pts[i + 1], kind }); };
  for (let lat = -75; lat <= 75; lat += 15) {
    const a = lat * Math.PI / 180, pts = [];
    for (let i = 0; i <= 120; i++) { const t = i / 120 * Math.PI * 2; pts.push([Math.cos(a) * Math.cos(t), Math.sin(a), Math.cos(a) * Math.sin(t)]); }
    addPoly(pts, lat === 0 ? 'eq' : 'shell');
  }
  for (let m = 0; m < 24; m++) {
    const t = m / 24 * Math.PI * 2, pts = [];
    for (let i = 0; i <= 60; i++) { const a = -Math.PI / 2 + i / 60 * Math.PI; pts.push([Math.cos(a) * Math.cos(t), Math.sin(a), Math.cos(a) * Math.sin(t)]); }
    addPoly(pts, 'shell');
  }
  const iv = [[0,1,PHI],[0,-1,PHI],[0,1,-PHI],[0,-1,-PHI],[1,PHI,0],[-1,PHI,0],[1,-PHI,0],[-1,-PHI,0],[PHI,0,1],[-PHI,0,1],[PHI,0,-1],[-PHI,0,-1]]
    .map(v => { const l = Math.hypot(...v); return v.map(c => c / l * 0.56); });
  for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
    const d = Math.hypot(iv[i][0] - iv[j][0], iv[i][1] - iv[j][1], iv[i][2] - iv[j][2]);
    if (d < 0.56 * 1.06) {
      const pts = []; for (let k = 0; k <= 8; k++) pts.push(iv[i].map((c, n) => c + (iv[j][n] - c) * k / 8));
      addPoly(pts, 'cage');
    }
  }

  const rot = (p, ay, ax) => {
    let c = Math.cos(ay), s = Math.sin(ay);
    const x = c * p[0] + s * p[2], z = -s * p[0] + c * p[2];
    c = Math.cos(ax); s = Math.sin(ax);
    return [x, c * p[1] - s * z, s * p[1] + c * z];
  };
  const F = 5.5;
  const proj = p => { const k = F / (F - p[2]); return [CX + p[0] * R * k, CY - p[1] * R * k, p[2]]; };
  const norm = v => { const l = Math.hypot(...v) || 1; return v.map(c => c / l); };
  const LIGHT = norm([-0.75, 0.55, 0.45]);     // window high on the left
  const ang = 122 * Math.PI / 180;             // matches --beam-angle
  const dir = [Math.cos(ang - Math.PI / 2), Math.sin(ang - Math.PI / 2)];
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  // venetian blind: 74px period, soft-edged slats; the beam envelope falls off toward lower right
  function blind(x, y) {
    const d = x * dir[0] + y * dir[1];
    const f = ((d % 74) + 74) % 74;
    const slat = smooth(20, 30, f) * (1 - smooth(54, 64, f));
    const env = 1 - smooth(0.25, 1.05, Math.hypot((x - 980) / 560, (y - 250) / 440));
    return slat * env;
  }

  function draw(t) {
    const ctx = cv.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // cast shadow on the table, and a dark occlusion on the wall where the object blocks the beam
    ctx.save();
    const sh = ctx.createRadialGradient(CX + 120, 712, 10, CX + 120, 712, 380);
    sh.addColorStop(0, 'rgba(0,0,0,.75)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.translate(0, 712); ctx.scale(1, .16); ctx.translate(0, -712);
    ctx.fillStyle = sh; ctx.fillRect(0, 0, W, H * 8); ctx.restore();
    const occ = ctx.createRadialGradient(CX + 110, CY + 70, R * 0.5, CX + 110, CY + 70, R * 1.35);
    occ.addColorStop(0, 'rgba(6,5,4,.8)'); occ.addColorStop(1, 'rgba(6,5,4,0)');
    ctx.fillStyle = occ; ctx.fillRect(0, 0, W, H);

    // the ember at the heart: the only self-lit thing in the room
    const flick = reduce ? 1 : 0.94 + Math.sin(t * 5.3) * 0.03 + Math.sin(t * 11.9) * 0.03;
    const em = ctx.createRadialGradient(CX, CY, 0, CX, CY, 150 * flick);
    em.addColorStop(0, 'rgba(255,214,170,.95)'); em.addColorStop(.08, 'rgba(255,140,70,.75)');
    em.addColorStop(.35, 'rgba(255,94,26,.16)'); em.addColorStop(1, 'rgba(255,94,26,0)');
    ctx.fillStyle = em; ctx.beginPath(); ctx.arc(CX, CY, 150 * flick, 0, Math.PI * 2); ctx.fill();

    const ay = 0.5 + t * 0.05, ax = 0.22;
    const list = segs.map(s => {
      const cage = s.kind === 'cage';
      const a = proj(rot(s.a, cage ? -ay * 1.4 : ay, ax)), b = proj(rot(s.b, cage ? -ay * 1.4 : ay, ax));
      const mid = [(s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2, (s.a[2] + s.b[2]) / 2];
      const n = norm(rot(mid, cage ? -ay * 1.4 : ay, ax));
      return { a, b, z: (a[2] + b[2]) / 2, n, kind: s.kind };
    }).sort((p, q) => p.z - q.z);

    ctx.lineCap = 'round';
    for (const s of list) {
      const mx = (s.a[0] + s.b[0]) / 2, my = (s.a[1] + s.b[1]) / 2;
      const front = (s.z + 1) / 2;                                   // 0 back, 1 front
      const lam = Math.max(0, s.n[0] * LIGHT[0] + s.n[1] * LIGHT[1] + s.n[2] * LIGHT[2]);
      const lit = blind(mx, my) * (s.kind === 'cage' ? 0.45 : (0.22 + 0.78 * lam)) * (0.45 + 0.55 * front);  // light only where a slat gap falls
      const emberSide = s.kind === 'cage' ? 0.55 : Math.max(0, -s.n[2]) * 0.4; // inner faces catch the ember
      // dark bronze in shadow, warm paper-white in the slats
      const r = 38 + 205 * lit + 120 * emberSide, g = 26 + 190 * lit + 40 * emberSide, b = 20 + 160 * lit + 8 * emberSide;
      const alpha = (0.28 + 0.72 * front) * (s.kind === 'cage' ? 0.8 : 1);
      ctx.strokeStyle = `rgba(${Math.min(255, r) | 0},${Math.min(255, g) | 0},${Math.min(255, b) | 0},${alpha})`;
      ctx.lineWidth = (s.kind === 'eq' ? 2.2 : s.kind === 'cage' ? 1.1 : 1.5) * (0.55 + 0.75 * front) + lit * 0.6;
      ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke();
    }

    // specular glints where a slat crosses the shell's near face
    for (const s of list) {
      if (s.kind === 'cage' || s.z < 0.55) continue;
      const mx = (s.a[0] + s.b[0]) / 2, my = (s.a[1] + s.b[1]) / 2;
      const lam = Math.max(0, s.n[0] * LIGHT[0] + s.n[1] * LIGHT[1] + s.n[2] * LIGHT[2]);
      const k = Math.pow(lam, 8) * blind(mx, my);
      if (k < 0.18) continue;
      ctx.strokeStyle = `rgba(255,246,232,${k * 0.8})`; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke();
    }
  }

  let raf = 0, running = true;
  const loop = ms => { draw(ms / 1000 + 3.4); if (running) raf = requestAnimationFrame(loop); };
  document.addEventListener('visibilitychange', () => {
    if (reduce) return;
    running = !document.hidden; cancelAnimationFrame(raf); if (running) raf = requestAnimationFrame(loop);
  });
  addEventListener('resize', fit);
  fit();
  if (!reduce) raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
